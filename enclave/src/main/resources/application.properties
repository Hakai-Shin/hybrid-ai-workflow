spring.application.name=enclave

# JPA / H2 (local dev)
spring.datasource.url=jdbc:h2:mem:enclave;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# GCP
gcp.project-id=${GCP_PROJECT_ID:local-dev}
gcs.artifact-bucket=${GCS_ARTIFACT_BUCKET:docubrain-artifacts-dev}
pubsub.topic=${PUBSUB_TOPIC:artifact-intake}

# Presidio sidecar
presidio.url=${PRESIDIO_URL:http://localhost:8081}
presidio.timeout-seconds=30

# Pipeline
enclave.version=${ENCLAVE_VERSION:0.1.0}
data.dir=${DATA_DIR:/data}

# Logging
logging.config=classpath:logback-spring.xml
