spring:
  application:
    name: docubrain-enclave
  datasource:
    url: jdbc:h2:file:./data/enclave-db;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

server:
  port: 8080

presidio:
  url: ${PRESIDIO_URL:http://localhost:8081}
  timeout-seconds: 30

gcp:
  project-id: ${GCP_PROJECT_ID}
  artifact-bucket: ${GCS_ARTIFACT_BUCKET:docubrain-artifacts-dev}
  pubsub-topic: ${PUBSUB_TOPIC:artifact-intake}

enclave:
  version: ${ENCLAVE_VERSION:0.1.0}
  data-dir: ${DATA_DIR:/data}

logging:
  structured:
    format:
      console: ecs
